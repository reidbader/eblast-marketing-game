<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<title>Eblast Marketing Game</title>
<link rel="stylesheet" href="styles-v7.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="shell">
<header><div><small>EBLAST INTELLIGENCE · MOBILE V7</small><h1>Marketing Game</h1></div><button id="auth">Connect Google</button></header>

<section class="scores">
<div><b id="daily">0</b><span>Daily / 10</span></div>
<div><b id="weekly">0</b><span>Weekly / 50</span></div>
<div><b id="monthly">0</b><span>Monthly / 200</span></div>
</section>

<section class="mission" id="mission">
  <div><small>TODAY'S MISSION</small><strong id="missionText">Review 10 new marketing blasts</strong></div>
  <div class="progress"><span id="missionBar"></span></div>
</section>

<nav>
<button class="tab active" data-view="inbox">Daily Queue</button>
<button class="tab" data-view="top10">Top 10</button>
<button class="tab" data-view="ready">Ready</button>
</nav>

<div id="periodTabs" class="period-tabs hidden">
  <button class="period active" data-period="daily">Daily</button>
  <button class="period" data-period="weekly">Weekly</button>
  <button class="period" data-period="monthly">Monthly</button>
</div>

<button id="filterToggle" class="filter-toggle">Filters</button>
<section class="filters" id="filtersPanel">
<input id="q" placeholder="Search">
<details class="multi-filter" id="continentFilter">
  <summary id="continentSummary">All continents</summary>
  <div class="multi-options" id="continentOptions"></div>
</details>
<details class="multi-filter" id="senderTypeFilter">
  <summary id="senderTypeSummary">All sender types</summary>
  <div class="multi-options" id="senderTypeOptions"></div>
</details>
<select id="activity"><option value="">All activities</option></select>
<select id="traveler"><option value="">All travelers</option></select>
<select id="deal"><option value="">All deal types</option></select>
</section>

<p id="status">Connect Google to load the sheet.</p>
<main id="cards"></main>
</div>

<dialog id="editor"><form method="dialog">
<button class="close">×</button>
<small id="sender"></small><h2 id="subject"></h2>
<div class="detail-meta" id="detailMeta"></div>
<p id="dealSummary" class="deal-summary"></p><p id="summary"></p><p id="why"></p><p id="validity"></p>

<div class="grid">
<label>Destination<input id="fDestination"></label>
<label>Activity<input id="fActivity"></label>
<label>Traveler Type<input id="fTraveler"></label>
<label>Deal Type<input id="fDeal"></label>
<label>Reid Rank<select id="fRank"><option></option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
<label>Marketing Score<input id="fScore" type="number" min="0" max="100"></label>
<label>Marketing Status<select id="fMStatus"><option></option><option>Candidate</option><option>Shortlist</option><option>Ready</option><option>Published</option><option>Skip</option></select></label>
<label>Status<select id="fStatus"><option>New</option><option>Reviewed</option><option>Action</option><option>Ignore</option></select></label>
<label class="wide">Marketing Angle<input id="fAngle" placeholder="What is the marketing hook?"></label>
<label class="wide">Tags<input id="fTags" placeholder="Safari, family, luxury..."></label>
<label class="wide">Notes<textarea id="fNotes" rows="4"></textarea></label>
</div>
<div class="actions"><a id="source" target="_blank">Open email</a><button type="button" id="skip">Skip</button><button type="button" id="promote">Promote</button><button type="button" id="save">Save & Next</button></div>
</form></dialog>

<script src="config.js?v=20261003-7"></script>
<script src="app-v7.js"></script>
</body></html>
