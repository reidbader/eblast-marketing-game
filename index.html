<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<title>Eblast Marketing Game</title>
<link rel="stylesheet" href="styles-v10.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="shell">
<header><div><small>EBLAST INTELLIGENCE · MOBILE V10</small><h1>Marketing Game</h1></div><button id="auth">Connect Google</button></header>

<section class="scores">
<div><b id="daily">0</b><span>Daily / 10</span></div>
<div><b id="weekly">0</b><span>Weekly / 50</span></div>
<div><b id="monthly">0</b><span>Monthly / 200</span></div>
</section>

<section class="mission" id="mission">
  <div><small>TODAY'S MISSION</small><strong id="missionText">Review 10 new marketing blasts</strong></div>
  <div class="progress"><span id="missionBar"></span></div>
</section>

<nav>
<button class="tab active" data-view="inbox">Daily Queue</button>
<button class="tab" data-view="top10">Top</button>
<button class="tab" data-view="ready">Ready</button>
<button class="tab" data-view="all">All</button>
</nav>

<div id="periodTabs" class="period-tabs hidden">
  <button class="period active" data-period="daily">Daily</button>
  <button class="period" data-period="weekly">Weekly</button>
  <button class="period" data-period="monthly">Monthly</button>
</div>

<div id="topSizeTabs" class="period-tabs hidden">
  <button class="top-size period active" data-limit="10">Top 10</button>
  <button class="top-size period" data-limit="100">Top 100</button>
  <button class="top-size period" data-limit="all">All</button>
</div>

<button id="filterToggle" class="filter-toggle">Filters</button>
<section class="filters" id="filtersPanel">
<input id="q" placeholder="Search">
<details class="multi-filter supplier-filter" id="supplierFilter">
  <summary id="supplierSummary">All suppliers</summary>
  <div class="multi-options supplier-options">
    <input id="supplierSearch" class="multi-search" type="search" placeholder="Type to filter suppliers">
    <div id="supplierOptions"></div>
  </div>
</details>
<details class="multi-filter" id="continentFilter">
  <summary id="continentSummary">All continents</summary>
  <div class="multi-options" id="continentOptions"></div>
</details>
<details class="multi-filter" id="senderTypeFilter">
  <summary id="senderTypeSummary">All sender types</summary>
  <div class="multi-options" id="senderTypeOptions"></div>
</details>
<details class="multi-filter" id="activityFilter">
  <summary id="activitySummary">All activities</summary>
  <div class="multi-options" id="activityOptions"></div>
</details>
<details class="multi-filter" id="travelerFilter">
  <summary id="travelerSummary">All traveler types</summary>
  <div class="multi-options" id="travelerOptions"></div>
</details>
<select id="dealScope" class="deal-scope">
  <option value="">All deals + news</option>
  <option value="deals">Deals only</option>
  <option value="news">No Deal / News only</option>
</select>
<details class="multi-filter" id="dealTypeFilter">
  <summary id="dealTypeSummary">All deal types</summary>
  <div class="multi-options" id="dealTypeOptions"></div>
</details>
</section>
<div class="mode-launches">
  <button id="rapidBtn" class="rapid-launch">Tinder</button>
  <button id="compareBtn" class="compare-launch">Hot or Not</button>
  <button id="pointsBtn" class="points-launch">Points Mode</button>
</div>

<p id="status">Connect Google to load the sheet.</p>
<main id="cards"></main>
</div>

<dialog id="editor"><form method="dialog">
<button class="close">×</button>
<small id="sender"></small><h2 id="subject"></h2>
<div class="detail-meta" id="detailMeta"></div>
<p id="dealSummary" class="deal-summary"></p><p id="summary"></p><p id="why"></p><p id="validity"></p>

<div class="grid">
<label>Destination<input id="fDestination"></label>
<label>Activity<input id="fActivity"></label>
<label>Traveler Type<input id="fTraveler"></label>
<label>Deal Type<input id="fDeal"></label>
<label>Reid Rank<select id="fRank"><option></option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
<label>Marketing Score<input id="fScore" type="number" min="0" max="100"></label>
<label>Marketing Status<select id="fMStatus"><option></option><option>Candidate</option><option>Shortlist</option><option>Ready</option><option>Published</option><option>Skip</option></select></label>
<label>Status<select id="fStatus"><option>New</option><option>Reviewed</option><option>Action</option><option>Ignore</option></select></label>
<label class="wide">Marketing Angle<input id="fAngle" placeholder="What is the marketing hook?"></label>
<label class="wide">Tags<input id="fTags" placeholder="Safari, family, luxury..."></label>
<label class="wide">Notes<textarea id="fNotes" rows="4"></textarea></label>
</div>
<div class="actions"><a id="source" target="_blank">Open email</a><button type="button" id="skip">Skip</button><button type="button" id="promote">Promote</button><button type="button" id="save">Save & Next</button></div>
</form></dialog>

<dialog id="rapid">
  <section class="rapid-shell">
    <div class="rapid-top">
      <button type="button" id="rapidExit" class="btn-quiet">Exit</button>
      <div id="rapidCount" class="rapid-count"></div>
    </div>
    <div id="rapidCard" class="rapid-card"></div>
    <div class="rapid-actions">
      <button type="button" id="rapidBack" class="rapid-back">Back</button>
      <button type="button" id="rapidDemote" class="rapid-demote">← −5</button>
      <a id="rapidEmail" class="rapid-email" href="#" target="_blank" rel="noopener">Email</a>
      <button type="button" id="rapidPromote" class="rapid-promote">+5 →</button>
    </div>
  </section>
</dialog>

<dialog id="compare">
  <section class="compare-shell">
    <div class="compare-top">
      <button type="button" id="compareExit" class="btn-quiet">Exit</button>
      <div id="compareCount" class="rapid-count"></div>
    </div>
    <div id="compareGrid" class="compare-grid"></div>
  </section>
</dialog>

<dialog id="points">
  <section class="points-shell">
    <div class="rapid-top">
      <button type="button" id="pointsExit" class="btn-quiet">Exit</button>
      <div id="pointsCount" class="rapid-count"></div>
    </div>
    <div id="pointsCard" class="rapid-card"></div>
    <div class="points-actions">
      <button type="button" class="points-adjust minus" data-delta="-1">−1</button>
      <button type="button" class="points-adjust plus" data-delta="1">+1</button>
      <button type="button" class="points-adjust minus" data-delta="-10">−10</button>
      <button type="button" class="points-adjust plus" data-delta="10">+10</button>
      <button type="button" class="points-adjust minus" data-delta="-25">−25</button>
      <button type="button" class="points-adjust plus" data-delta="25">+25</button>
    </div>
  </section>
</dialog>

<script src="config.js?v=20261003-10"></script>
<script src="app-v10.js?v=20261003-19"></script>
<script src="quota-fix.js?v=20261007-1"></script>
</body></html>
